<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta
      name="description"
      content="AMix-2 is a new-generation protein–text foundation model built on diffusion large language models for native protein understanding and design."
    />
    <title>AMix-2</title>
    <link rel="stylesheet" href="./styles.css" />
    <link rel="stylesheet" href="./assets/katex/katex-D96Be8fu.css" />
  </head>
  <body>
    <header class="topbar" aria-label="Site header">
      <a class="brand" href="./" aria-label="AMix-2 home">
        <img
          class="brand-logo"
          src="./assets/sail-logo.svg"
          alt="Shanghai Artificial Intelligence Laboratory"
        />
      </a>

      <div class="locale-switch" aria-label="Language switch">
        <button class="locale-button is-active" type="button" data-lang="zh">中文</button>
        <button class="locale-button" type="button" data-lang="en">EN</button>
      </div>
    </header>

    <main class="page">
      <section class="article-hero" aria-labelledby="page-title">
        <p class="publish-date" data-i18n="date"></p>
        <div class="hero-title-lockup">
          <h1 id="page-title" class="brand-title" aria-label="AMix-2">
            <img
              class="title-a-mark"
              src="./assets/intro_combine2.jpeg"
              alt=""
              aria-hidden="true"
              decoding="async"
            />
            <span data-i18n="titleRest"></span>
          </h1>
        </div>
        <p class="hero-summary" data-i18n="summary">
        </p>

        <div class="action-row" aria-label="Page actions">
          <button class="seed-button primary placeholder-action" type="button" aria-disabled="true" data-i18n="reportButton">
          </button>
          <button class="seed-button placeholder-action" type="button" aria-disabled="true" data-i18n="tryButton">
          </button>
        </div>
      </section>

      <section id="demo-video" class="video-block" aria-label="AMix-2 video">
        <div class="video-frame video-frame--media">
          <video class="hero-video" controls playsinline preload="metadata">
            <source src="./assets/amix2-all-add_audio-4k30-high-512.mp4" type="video/mp4" />
          </video>
        </div>
      </section>

      <section class="background-lead" aria-label="AMix-2 background">
        <p data-i18n-html="backgroundLead"></p>
      </section>

      <article class="content">
        <section class="content-section" aria-labelledby="overview-title">
          <h2 id="overview-title" data-i18n="overviewTitle">概述</h2>
          <p data-i18n-html="overviewOne"></p>
          <p data-i18n="overviewTwo"></p>
          <p data-i18n="overviewThree"></p>
        </section>

        <figure class="architecture-visual" aria-label="AMix-2 block-wise diffusion architecture">
          <img
            class="architecture-chart"
            src="./assets/dllm.png?v=20260520-0051"
            alt="AMix-2 block-wise diffusion language model architecture"
            loading="lazy"
            decoding="async"
          />
          <figcaption data-i18n="dllmCaption">
            AMix-2采用分块扩散语言模型架构，统一建模蛋白质和文本
          </figcaption>
        </figure>

        <section class="content-section" aria-labelledby="paradigm-title">
          <h2 id="paradigm-title" data-i18n="paradigmTitle"></h2>
          <p data-i18n="paradigmIntro"></p>

          <ul class="task-list">
            <li>
              <span class="task-lead" data-i18n="understandingLead"></span>
              <span data-i18n-html="understandingText"></span>
              <span class="formula-inline" data-i18n-html="understandingFormula"></span>
            </li>
            <li>
              <span class="task-lead" data-i18n="designLead"></span>
              <span data-i18n-html="designText"></span>
              <span class="formula-inline" data-i18n-html="designFormula"></span>
            </li>
          </ul>
        </section>

        <section class="content-section" aria-labelledby="method-title">
          <h2 id="method-title" data-i18n="methodTitle"></h2>
          <p data-i18n-html="methodIntro"></p>

          <p>
            <span class="paragraph-lead" data-i18n="maskTitle"></span>
            <span data-i18n-html="maskText"></span>
          </p>
          <div class="formula-block" data-i18n-html="maskFormula"></div>
          <p data-i18n="maskMore"></p>

          <p>
            <span class="paragraph-lead" data-i18n="blockTitle"></span>
            <span data-i18n="blockText"></span>
          </p>
          <div class="formula-block" data-i18n-html="blockFormula"></div>
          <p data-i18n="blockMore"></p>

          <figure class="method-visual" aria-label="AMix-2 block-wise diffusion animation">
            <img
              class="method-gif"
              src="./assets/amix-block-zh-4k30-high-loop.gif"
              alt="AMix-2 block-wise diffusion 方法动画"
              data-locale-visual="zh"
              loading="lazy"
              decoding="async"
            />
            <img
              class="method-gif"
              src="./assets/amix-block-4k30-high-loop.gif"
              alt="AMix-2 block-wise diffusion method animation"
              data-locale-visual="en"
              loading="lazy"
              decoding="async"
              hidden
            />
            <figcaption data-i18n="methodGifCaption">
              AMix-2 的分块扩散过程：block 间因果生成，block 内并行去噪。
            </figcaption>
          </figure>
        </section>

        <section class="content-section" aria-labelledby="results-title">
          <h2 id="results-title" data-i18n="resultsTitle"></h2>
          <p data-i18n-html="resultsText"></p>
          <p data-i18n-html="resultsMore"></p>
          <p data-i18n-html="resultsNumbers"></p>
          <p data-i18n="resultsClosing"></p>
        </section>

        <figure id="perf-visual" class="perf-visual" aria-label="AMix-2 performance comparison">
          <img
            class="perf-chart"
            src="./assets/perf.png?v=20260519-2237"
            alt="AMix-2 performance comparison across protein understanding and design tasks"
            loading="lazy"
            decoding="async"
          />
          <figcaption data-i18n="perfCaption">
            AMix-2在各种蛋白质理解设计任务上领先于主流大模型和蛋白质语言模型
          </figcaption>
        </figure>

        <section class="content-section" aria-labelledby="takeaway-title">
          <h2 id="takeaway-title" data-i18n="takeawayTitle"></h2>
          <p data-i18n="takeawayText"></p>
        </section>
      </article>
    </main>

    <script src="./script.js"></script>
    <script type="module" src="./math-renderer.js"></script>
  </body>
</html>
